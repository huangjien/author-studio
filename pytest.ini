[pytest]
# Use coverage by default; pytest.ini takes precedence over pyproject.toml,
# so we must define addopts here to ensure coverage is generated.
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-report=html:reports/htmlcov

testpaths = tests

filterwarnings =
    # Silence noisy UserWarning emitted by langsmith using Pydantic V1 on Python 3.14+
    ignore::UserWarning:langsmith.schemas
