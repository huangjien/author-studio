[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "author-studio"
version = "0.1.0"
description = "AI Agent Hosting Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.0",
  "httpx==0.27.0",
  "PyYAML==6.0.1",
  "pydantic==2.8.2",
  "aiosqlite==0.20.0",
  "cachetools==5.3.3",
  "anyio==4.11.0",
  "certifi==2025.10.5",
  "click==8.3.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "idna==3.11",
  "pydantic-core==2.41.4",
  "sniffio==1.3.1",
  "starlette==0.40.0",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "black==24.8.0",
  "isort==5.13.2",
  "flake8==7.1.1",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=html:reports/htmlcov",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 0

[tool.coverage.html]
directory = "reports/htmlcov"
title = "Author Studio Coverage"